name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  plugin-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zstd

      - name: Download Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-lin-x64.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
          echo "RACK_DIR=$RUNNER_TEMP/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: make dist

  panels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/panelgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/panelgen/go.mod
          cache-dependency-path: tools/panelgen/go.sum

      - name: Test, and check the generated panels are current
        run: go test ./...
