name: build

# Docs-only changes build nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# A new push to a PR cancels its older run; builds on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  # The Library builds Windows, macOS (x64, arm64) and Linux itself, so each
  # platform it builds is compiled here before a submission. Windows is built
  # locally with MSYS2.
  plugin:
    name: plugin (${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sdk: lin-x64 }
          - { os: macos-15-intel, sdk: mac-x64 }
          - { os: macos-15, sdk: mac-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zstd

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq zstd

      - name: Download Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
          echo "RACK_DIR=$RUNNER_TEMP/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Package
        run: make dist

  commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the dispatch table against protocol/commands.json
        run: tools/check-commands.sh

  panels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/panelgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/panelgen/go.mod
          cache-dependency-path: tools/panelgen/go.sum

      - name: Test, and check the generated panels are current
        run: go test ./...

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
