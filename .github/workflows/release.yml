name: release

# Pushing a tag vX.Y.Z builds brumista-mcp for every platform and publishes a
# GitHub Release with the binaries. The tag must match plugin.json's version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Check the tag against plugin.json
        run: |
          version=$(jq -r .version plugin.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match plugin.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Test
        working-directory: mcp
        run: go test ./...

      - name: Build
        working-directory: mcp
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../release
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "../release/brumista-mcp-${VERSION}-${os}-${arch}${ext}" .
          done
          cd ../release && sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "W72 ${VERSION}" --generate-notes
